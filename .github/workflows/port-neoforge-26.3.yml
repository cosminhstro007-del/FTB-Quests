name: Experimental NeoForge 26.3 compile

on:
  push:
    branches:
      - port/neoforge-26.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neoforge-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile FTB Quests for NeoForge 26.3
        run: bash ./gradlew :neoforge:classes :neoforge:jar --no-daemon --stacktrace --console=plain

      - name: Upload experimental JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ftb-quests-neoforge-26.3-experimental
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
