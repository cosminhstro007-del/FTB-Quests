name: FL0X FTB 26.3 keyboard fix and full mods bundle

on:
  push:
    branches:
      - fix/quests-keyboard-26.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-ftb-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SNAPSHOT: 'true'
    steps:
      - name: Checkout FTB Quests 26.3 port and package tools
        uses: actions/checkout@v4

      - name: Checkout FTB Library 26.3
        uses: actions/checkout@v4
        with:
          repository: FTBTeam/FTB-Library
          ref: feature/26.3
          path: _ftb-library

      - name: Checkout FTB Teams 26.3
        uses: actions/checkout@v4
        with:
          repository: FTBTeam/FTB-Teams
          ref: feature/26.3
          path: _ftb-teams

      - name: Checkout FTB Ranks 26.3
        uses: actions/checkout@v4
        with:
          repository: FTBTeam/FTB-Ranks
          ref: feature/26.3
          path: _ftb-ranks

      - name: Checkout FTB Essentials 26.3
        uses: actions/checkout@v4
        with:
          repository: FTBTeam/FTB-Essentials
          ref: feature/26.3
          path: _ftb-essentials

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix FTB Library SDL keyboard input for Minecraft 26.3
        run: python3 tools/patch-ftb-library-sdl-key-26.3.py _ftb-library

      - name: Build FTB Library (publish dependency locally)
        working-directory: _ftb-library
        run: bash ./gradlew :common:publishToMavenLocal :fabric:publishToMavenLocal :neoforge:publishToMavenLocal --no-daemon --stacktrace --console=plain

      - name: Apply FTB Teams 26.3 network adaptation
        run: python3 tools/patch-ftb-teams-26.3.py _ftb-teams

      - name: Build FTB Teams (publish dependency locally)
        working-directory: _ftb-teams
        run: bash ./gradlew :common:publishToMavenLocal :fabric:publishToMavenLocal :neoforge:publishToMavenLocal --no-daemon --stacktrace --console=plain

      - name: Build FTB Ranks (publish dependency locally)
        working-directory: _ftb-ranks
        run: bash ./gradlew :common:publishToMavenLocal :fabric:publishToMavenLocal :neoforge:publishToMavenLocal --no-daemon --stacktrace --console=plain

      - name: Build FTB Essentials NeoForge JAR
        working-directory: _ftb-essentials
        run: bash ./gradlew :neoforge:classes :neoforge:jar --no-daemon --stacktrace --console=plain

      - name: Build FTB Quests NeoForge JAR
        run: bash ./gradlew :neoforge:classes :neoforge:jar --no-daemon --stacktrace --console=plain

      - name: Verify and assemble clean mods folder
        run: python3 tools/package-ftb-suite-26.3.py

      - name: Upload one complete FTB 26.3 mods ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FL0X_FTB_26.3_KEYBOARD_FIX_ALL_5_MODS
          path: FL0X_FTB_26_3/
          if-no-files-found: error
